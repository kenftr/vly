        const STORAGE_KEY = 'quizAttempts';
        const LAST_LESSON_KEY = 'lastLesson';
        const STARRED_KEY = 'quizStarred';

        let currentQuestions = [];
        let userAnswers = {};
        let isSubmitted = false;
        let lessonStartTime = null;

        const quizContainer = document.getElementById('quizContainer');
        const lessonSelect = document.getElementById('lessonSelect');
        const submitBtn = document.getElementById('submitBtn');
        const continueBtn = document.getElementById('continueBtn');
        const retryBtn = document.getElementById('retryBtn');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const statsSummary = document.getElementById('statsSummary');
        const statsChart = document.getElementById('statsChart');
        const stickyHeader = document.getElementById('stickyHeader');
        const resetStatsBtn = document.getElementById('resetStatsBtn');

        function shuffleArray(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function loadStarred() {
            try {
                const raw = localStorage.getItem(STARRED_KEY);
                const parsed = raw ? JSON.parse(raw) : {};
                return parsed && typeof parsed === 'object' ? parsed : {};
            } catch (error) {
                console.error('Lỗi đọc sao:', error);
                return {};
            }
        }

        function saveStarred(starred) {
            localStorage.setItem(STARRED_KEY, JSON.stringify(starred));
        }

        function getStarredSet(lessonKey) {
            const starred = loadStarred();
            const list = starred[lessonKey] || [];
            return new Set(list.map(String));
        }

        function updateHeaderCollapse() {
            if (!stickyHeader) return;
            if (window.scrollY > 120) {
                stickyHeader.classList.add('is-collapsed');
            } else {
                stickyHeader.classList.remove('is-collapsed');
            }
        }

        function initSelectBox() {
            lessonSelect.innerHTML = '';

            fileList.forEach(fileName => {
                const option = document.createElement('option');
                option.value = fileName;
                option.textContent = `Bài: ${fileName}`;
                lessonSelect.appendChild(option);
            });

            const mixedOption = document.createElement('option');
            mixedOption.value = 'mixed';
            mixedOption.textContent = 'Hỗn hợp (Trộn tất cả)';
            lessonSelect.appendChild(mixedOption);
        }

        function loadAttempts() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                const parsed = raw ? JSON.parse(raw) : [];
                return Array.isArray(parsed) ? parsed : [];
            } catch (error) {
                console.error('Lỗi đọc thống kê:', error);
                return [];
            }
        }

        function saveAttempts(attempts) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(attempts));
        }

        function formatDuration(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${String(secs).padStart(2, '0')}`;
        }

        function renderStats(lessonKey) {
            const attempts = loadAttempts();
            const selectedKey = lessonKey || lessonSelect.value;
            const filtered = attempts.filter(item => item.lessonKey === selectedKey);

            if (filtered.length === 0) {
                statsSummary.textContent = 'Chưa có dữ liệu.';
                statsChart.innerHTML = '';
                return;
            }

            const totalCorrect = filtered.reduce((sum, item) => sum + item.score, 0);
            const totalQuestions = filtered.reduce((sum, item) => sum + item.total, 0);
            const totalTime = filtered.reduce((sum, item) => sum + item.durationSec, 0);
            const accuracy = totalQuestions ? Math.round((totalCorrect / totalQuestions) * 100) : 0;
            const avgTime = Math.round(totalTime / filtered.length);
            const wrongPercent = 100 - accuracy;

            statsSummary.innerHTML = `
                <div class="stats-overview">
                    <div class="stats-overview-row">
                        <div class="stats-overview-label">Tỷ lệ đúng</div>
                        <div class="stats-overview-value">${accuracy}%</div>
                    </div>
                    <div class="stats-overview-bar">
                        <div class="stats-overview-correct" style="width: ${accuracy}%;"></div>
                        <div class="stats-overview-wrong" style="width: ${wrongPercent}%;"></div>
                    </div>
                    <div class="stats-overview-meta">Lần làm: ${filtered.length} · TB thời gian: ${formatDuration(avgTime)}</div>
                </div>
            `;

            statsChart.innerHTML = filtered.map((item, index) => {
                const correctPercent = item.total ? Math.round((item.score / item.total) * 100) : 0;
                const wrongPercent = 100 - correctPercent;
                return `
                    <div class="stats-row">
                        <div class="stats-label">Lần ${index + 1}</div>
                        <div class="stats-bar">
                            <div class="stats-correct" style="width: ${correctPercent}%;"></div>
                            <div class="stats-wrong" style="width: ${wrongPercent}%;"></div>
                        </div>
                        <div class="stats-meta">${item.score}/${item.total} · ${formatDuration(item.durationSec)}</div>
                    </div>
                `;
            }).join('');
        }

        function updateContinueButton() {
            const lastLesson = localStorage.getItem(LAST_LESSON_KEY);
            if (lastLesson) {
                continueBtn.classList.remove('hidden');
            } else {
                continueBtn.classList.add('hidden');
            }
        }

        async function loadLesson(lessonKey) {
            userAnswers = {};
            isSubmitted = false;
            quizContainer.classList.remove('submitted');
            submitBtn.classList.add('hidden');
            retryBtn.classList.add('hidden');
            scoreDisplay.classList.add('hidden');
            quizContainer.innerHTML = '<p class="text-center text-gray-500 mt-10">Đang tải dữ liệu...</p>';

            lessonStartTime = Date.now();
            localStorage.setItem(LAST_LESSON_KEY, lessonKey);
            updateContinueButton();

            try {
                if (lessonKey === 'mixed') {
                    const allDataArrays = fileList.map(name => sampleData[name] || []);
                    const combinedData = allDataArrays.flat();
                    currentQuestions = shuffleArray(combinedData);
                } else {
                    const lessonData = sampleData[lessonKey];
                    if (!lessonData) throw new Error('Không tìm thấy dữ liệu bài học');
                    currentQuestions = lessonData;
                }

                renderQuiz();
                renderStats(lessonKey);
            } catch (error) {
                console.error("Lỗi khi load file:", error);
                quizContainer.innerHTML = `<p class="text-center text-red-500 mt-10">Lỗi tải dữ liệu. Hãy chắc chắn dữ liệu bài học có tồn tại.</p>`;
            }
        }

        function renderQuiz() {
            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (!currentQuestions || currentQuestions.length === 0) {
                quizContainer.innerHTML = '<p class="text-center text-gray-500 mt-10">Không có câu hỏi nào.</p>';
                return;
            }

            submitBtn.classList.remove('hidden');
            const lessonKey = lessonSelect.value;
            const starredSet = getStarredSet(lessonKey);

            const html = currentQuestions.map((q, index) => {
                const isStarred = starredSet.has(String(q.id));
                return `
                <div class="card p-5 sm:p-6 rounded-2xl border" id="card-${q.id}" style="animation-delay: ${index * 40}ms;">
                    <p class="card-title font-medium text-lg mb-5">
                        <span class="font-bold text-blue-400 mr-1">Câu ${index + 1}:</span>
                        ${q.content.replace(/\n/g, '<br>')}
                    </p>
                    <div class="space-y-3">
                        ${Object.entries(q.options).map(([key, value]) => `
                            <label class="block relative cursor-pointer option-label group">
                                <input type="radio" name="question_${q.id}" value="${key}" class="peer sr-only" onchange="handleSelect('${q.id}', '${key}')">
                                <div id="opt-${q.id}-${key}" class="option-box p-4 rounded-xl border transition duration-200 flex items-start">
                                    <span class="font-bold text-slate-200 mr-3 w-6 text-center">${key}.</span>
                                    <span class="text-slate-200 leading-relaxed">${value}</span>
                                </div>
                            </label>
                        `).join('')}
                    </div>
                    <div class="card-actions mt-4 flex flex-wrap justify-end gap-2">
                        <button class="star-btn ${isStarred ? 'is-starred' : ''}" type="button" onclick="toggleStar('${q.id}')" data-question-id="${q.id}" aria-pressed="${isStarred ? 'true' : 'false'}" aria-label="${isStarred ? 'Bỏ gắn sao' : 'Gắn sao'}">
                            <span class="icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                    <path d="M12 17.27 18.18 21 16.54 13.97 22 9.24 14.81 8.63 12 2 9.19 8.63 2 9.24 7.46 13.97 5.82 21z" />
                                </svg>
                            </span>
                        </button>
                        <button class="answer-btn" type="button" onclick="showAnswer('${q.id}')">Xem đáp án</button>
                    </div>
                </div>
            `;
            }).join('');

            quizContainer.innerHTML = html;
        }

        window.toggleStar = (questionId) => {
            const lessonKey = lessonSelect.value;
            const starred = loadStarred();
            const list = Array.isArray(starred[lessonKey]) ? starred[lessonKey].map(String) : [];
            const set = new Set(list);
            const id = String(questionId);
            if (set.has(id)) {
                set.delete(id);
            } else {
                set.add(id);
            }
            starred[lessonKey] = Array.from(set);
            saveStarred(starred);

            const button = document.querySelector(`.star-btn[data-question-id="${id}"]`);
            if (!button) return;
            const isStarred = set.has(id);
            button.classList.toggle('is-starred', isStarred);
            button.setAttribute('aria-pressed', isStarred ? 'true' : 'false');
            button.setAttribute('aria-label', isStarred ? 'Bỏ gắn sao' : 'Gắn sao');
        };

        window.showAnswer = (questionId) => {
            const question = currentQuestions.find(q => String(q.id) === String(questionId));
            if (!question) return;
            const correctEl = document.getElementById(`opt-${question.id}-${question.answer}`);
            if (correctEl) correctEl.classList.toggle('correct-answer');
        };

        window.handleSelect = (questionId, optionKey) => {
            if (!isSubmitted) {
                userAnswers[questionId] = optionKey;
            }
        };

        function submitQuiz() {
            if (isSubmitted) return;

            if (Object.keys(userAnswers).length < currentQuestions.length) {
                const confirmSubmit = confirm("Bạn chưa trả lời hết các câu hỏi. Vẫn muốn nộp bài?");
                if (!confirmSubmit) return;
            }

            isSubmitted = true;
            quizContainer.classList.add('submitted');

            let score = 0;

            currentQuestions.forEach(q => {
                const userAns = userAnswers[q.id];
                const correctAns = q.answer;

                const correctEl = document.getElementById(`opt-${q.id}-${correctAns}`);
                if (correctEl) correctEl.classList.add('correct-answer');

                if (userAns) {
                    if (userAns === correctAns) {
                        score++;
                    } else {
                        const wrongEl = document.getElementById(`opt-${q.id}-${userAns}`);
                        if (wrongEl) wrongEl.classList.add('wrong-answer');
                    }
                }
            });

            const durationSec = lessonStartTime ? Math.max(0, Math.round((Date.now() - lessonStartTime) / 1000)) : 0;
            const attempts = loadAttempts();
            attempts.push({
                lessonKey: lessonSelect.value,
                score,
                total: currentQuestions.length,
                durationSec,
                ts: Date.now()
            });
            saveAttempts(attempts);
            renderStats(lessonSelect.value);

            scoreDisplay.textContent = `Điểm: ${score} / ${currentQuestions.length}`;
            scoreDisplay.classList.remove('hidden');

            submitBtn.classList.add('hidden');
            retryBtn.classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        lessonSelect.addEventListener('change', (e) => loadLesson(e.target.value));
        submitBtn.addEventListener('click', submitQuiz);
        continueBtn.addEventListener('click', () => {
            const lastLesson = localStorage.getItem(LAST_LESSON_KEY);
            const target = lastLesson || lessonSelect.value || fileList[0];
            lessonSelect.value = target;
            loadLesson(target);
        });
        retryBtn.addEventListener('click', () => loadLesson(lessonSelect.value));
        resetStatsBtn.addEventListener('click', () => {
            localStorage.removeItem(STORAGE_KEY);
            renderStats(lessonSelect.value);
        });

        window.addEventListener('scroll', updateHeaderCollapse, { passive: true });
        window.addEventListener('load', updateHeaderCollapse);

        initSelectBox();
        updateContinueButton();
        updateHeaderCollapse();
        if (fileList.length > 0) {
            const lastLesson = localStorage.getItem(LAST_LESSON_KEY);
            const initialLesson = lastLesson || fileList[0];
            lessonSelect.value = initialLesson;
            loadLesson(initialLesson);
        }
    </script>
</body>
